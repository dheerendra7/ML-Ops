name: Standalone KFP backend smoke test

on:
  push:
    paths:
      - ".github/workflows/kfp-backend-smoke.yml"
      - "scripts/test_kfp_backend.py"
      - "examples/kfp/**"
  pull_request:
    paths:
      - ".github/workflows/kfp-backend-smoke.yml"
      - "scripts/test_kfp_backend.py"
      - "examples/kfp/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-kfp-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-kfp-backend:
    name: Submit success and rejection runs to standalone KFP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create a disposable Kubernetes 1.34.3 cluster
        uses: helm/kind-action@v1.14.0
        with:
          node_image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
          kubectl_version: v1.34.3
          wait: 120s

      - name: Install standalone KFP 2.17.0 cluster-scoped resources
        run: |
          kubectl apply -k "https://github.com/kubeflow/pipelines/manifests/kustomize/cluster-scoped-resources?ref=2.17.0"
          kubectl wait --for=condition=Established crd --all --timeout=180s

      - name: Install the KFP 2.17.0 platform-agnostic environment
        run: |
          kubectl apply -k "https://github.com/kubeflow/pipelines/manifests/kustomize/env/platform-agnostic?ref=2.17.0"
          kubectl wait --for=condition=Available deployments --all -n kubeflow --timeout=600s
          kubectl get pods,services,deployments -n kubeflow -o wide

      - name: Install pinned KFP client SDK
        run: python -m pip install --disable-pip-version-check -r examples/kfp/requirements.txt

      - name: Submit a passing run and an expected quality-gate failure
        env:
          KFP_HOST: http://127.0.0.1:8888
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kfp-backend-home"
          # Start kubectl while the Kind action's kubeconfig is still under the
          # default HOME. Changing HOME before this command hides ~/.kube/config
          # and makes port-forward exit before binding localhost:8888.
          kubectl port-forward --address 127.0.0.1 -n kubeflow svc/ml-pipeline 8888:8888 >"$RUNNER_TEMP/kfp-port-forward.log" 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

          # Confirm the forwarded KFP health endpoint works before invoking the
          # Python SDK. Print the forwarder log if kubectl exited or the API
          # never became reachable, so the next failure has actionable evidence.
          PORT_READY=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$KFP_HOST/apis/v2beta1/healthz" >/dev/null; then
              PORT_READY=true
              echo "PASS: KFP health endpoint is reachable through port-forward"
              break
            fi
            if ! kill -0 "$PORT_FORWARD_PID" 2>/dev/null; then
              echo "ERROR: kubectl port-forward exited before the API became reachable."
              cat "$RUNNER_TEMP/kfp-port-forward.log" || true
              exit 1
            fi
            sleep 2
          done
          if [[ "$PORT_READY" != "true" ]]; then
            echo "ERROR: KFP API did not become reachable through port-forward."
            cat "$RUNNER_TEMP/kfp-port-forward.log" || true
            kubectl get endpoints ml-pipeline -n kubeflow -o yaml || true
            exit 1
          fi

          # Isolate KFP's local client-context file only after kubectl has
          # started and the HTTP forwarding path has been verified.
          export HOME="$RUNNER_TEMP/kfp-backend-home"
          python scripts/test_kfp_backend.py \
            --host "$KFP_HOST" \
            --package "$RUNNER_TEMP/backend-gate-pipeline.yaml" \
            --timeout-seconds 600

      - name: Show safe cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,services,deployments -n kubeflow -o wide || true
          kubectl get events -n kubeflow --sort-by=.lastTimestamp | tail -n 40 || true
          kubectl describe deployments -n kubeflow || true
