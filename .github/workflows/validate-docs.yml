name: Validate documentation and examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Markdown links, YAML, and Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Validate documentation and examples
        run: python scripts/validate_docs.py
      - name: Test security-sensitive example invariants
        run: python scripts/test_examples.py
      - name: Check Kubernetes lab Bash syntax
        run: bash -n scripts/test_kind_labs.sh

  compile-kfp-example:
    name: Compile KFP v2 example
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned KFP SDK
        run: python -m pip install --disable-pip-version-check -r examples/kfp/requirements-ci.txt

      - name: Compile pipeline and validate generated YAML
        run: |
          python examples/kfp/pipeline_artifacts_caching.py --output "$RUNNER_TEMP/artifact-gate-pipeline.yaml"
          python -c 'import os, yaml; from pathlib import Path; p = Path(os.environ["RUNNER_TEMP"]) / "artifact-gate-pipeline.yaml"; d = yaml.safe_load(p.read_text(encoding="utf-8")); assert isinstance(d, dict) and d; print("Compiled pipeline YAML parsed successfully.")'

      - name: Run KFP pipeline locally and test quality-gate behavior
        run: python scripts/test_kfp_local.py

  container-smoke-test:
    name: Build and run container smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the sample image
        run: docker build -t mlops-handbook-smoke:ci examples/container-image

      - name: Verify the configured runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' mlops-handbook-smoke:ci)" = "app:app"

      - name: Run with reduced container privileges
        run: docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop=ALL --security-opt=no-new-privileges mlops-handbook-smoke:ci
  kubernetes-integration-test:
    name: Kubernetes lab integration (${{ matrix.kubectl_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubectl_version: v1.35.0
            node_image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
          - kubectl_version: v1.34.3
            node_image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create digest-pinned disposable Kubernetes cluster
        uses: helm/kind-action@v1.14.0
        with:
          node_image: ${{ matrix.node_image }}
          kubectl_version: ${{ matrix.kubectl_version }}
          wait: 120s

      - name: Exercise ResourceQuota, LimitRange, Job, RBAC, and Secret rotation
        run: bash scripts/test_kind_labs.sh
