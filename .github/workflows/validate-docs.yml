name: Validate documentation and examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Markdown links, YAML, and Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Validate documentation and examples
        run: python scripts/validate_docs.py
      - name: Test security-sensitive example invariants
        run: python scripts/test_examples.py

  compile-kfp-example:
    name: Compile KFP v2 example
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned KFP SDK
        run: python -m pip install --disable-pip-version-check -r examples/kfp/requirements.txt

      - name: Compile pipeline and validate generated YAML
        run: |
          python examples/kfp/pipeline_artifacts_caching.py --output "$RUNNER_TEMP/artifact-gate-pipeline.yaml"
          python -c 'import os, yaml; from pathlib import Path; p = Path(os.environ["RUNNER_TEMP"]) / "artifact-gate-pipeline.yaml"; d = yaml.safe_load(p.read_text(encoding="utf-8")); assert isinstance(d, dict) and d; print("Compiled pipeline YAML parsed successfully.")'

  container-smoke-test:
    name: Build and run container smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the sample image
        run: docker build -t mlops-handbook-smoke:ci examples/container-image

      - name: Verify the configured runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' mlops-handbook-smoke:ci)" = "app:app"

      - name: Run with reduced container privileges
        run: docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop=ALL --security-opt=no-new-privileges mlops-handbook-smoke:ci
