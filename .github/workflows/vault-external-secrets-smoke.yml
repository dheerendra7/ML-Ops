name: Vault external-secrets integration smoke test

on:
  push:
    paths:
      - ".github/workflows/vault-external-secrets-smoke.yml"
      - "docs/security/external-secrets-vault-lab.md"
      - "examples/security/external-secrets/**"
      - "scripts/test_vault_external_secrets.sh"
      - "scripts/test_examples.py"
  pull_request:
    paths:
      - ".github/workflows/vault-external-secrets-smoke.yml"
      - "docs/security/external-secrets-vault-lab.md"
      - "examples/security/external-secrets/**"
      - "scripts/test_vault_external_secrets.sh"
      - "scripts/test_examples.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-external-secrets-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vault-external-secrets:
    name: Vault KV v2 to Kubernetes Secret and rotation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Helm 3
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Create a disposable Kubernetes 1.34.3 cluster
        uses: helm/kind-action@v1.14.0
        with:
          node_image: kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48
          kubectl_version: v1.34.3
          wait: 120s

      - name: Run Vault, External Secrets, least-privilege, and rotation test
        run: bash scripts/test_vault_external_secrets.sh

      - name: Show safe diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,services,statefulsets,deployments -A -o wide || true
          kubectl get secretstores,externalsecrets -n mlops-vault-lab -o wide || true
          kubectl describe externalsecret mlops-app-password -n mlops-vault-lab || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          helm list -A || true
