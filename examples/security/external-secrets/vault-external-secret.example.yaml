apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-app-password
  namespace: mlops-vault-lab
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: vault-local
    kind: SecretStore
  target:
    name: mlops-app-consumer
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: mlops-app
        property: password
