apiVersion: v1
kind: LimitRange
metadata:
  name: container-resource-defaults
  namespace: mlops-lab # Use a disposable namespace; see docs/labs/resource-governance.md.
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "500m"
        memory: 512Mi
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
