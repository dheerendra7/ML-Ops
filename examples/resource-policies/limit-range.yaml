apiVersion: v1
kind: LimitRange
metadata:
  name: container-resource-defaults
  namespace: ml-team # Replace with an existing, reviewed namespace.
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 1Gi
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "4"
        memory: 8Gi
