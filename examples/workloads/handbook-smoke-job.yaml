apiVersion: batch/v1
kind: Job
metadata:
  name: handbook-smoke-job
  namespace: mlops-lab # Use only in a disposable namespace; see the workload guide.
  labels:
    app.kubernetes.io/name: handbook-smoke-job
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: handbook-smoke-job
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "print('MLOps handbook smoke job completed')"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
